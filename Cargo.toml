[package]
name = "axum-health"
version = "0.1.0"
edition = "2024"
description = "MicroProfile-inspired health endpoints for Axum."
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
