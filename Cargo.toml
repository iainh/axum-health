[workspace]
members = [".", "axum-health-macros"]
resolver = "2"

[package]
name = "axum-health"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MicroProfile-inspired health endpoints for Axum."
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/axum-health"
keywords = ["axum", "health", "microprofile", "kubernetes"]
categories = ["web-programming"]

[dependencies]
axum-health-macros = { version = "0.1.0", path = "axum-health-macros" }
axum = { version = "0.8", default-features = false, features = ["json"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
trybuild = "1"
